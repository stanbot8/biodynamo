# Runs the installation tests in the following cases:
#   1) every day at 3 am
#   2) a pull request to the master branch

name: macOS System CI

on:
  schedule:
    # Every day at 3 am
  - cron: 0 3 * * *
  pull_request:
    # Upon pull requests
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    ((github.event_name == 'schedule' || github.event_name == 'workflow_run') &&
    'refs/heads/master' || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name 
    != 'workflow_run' && (true) }}

jobs:
  build:
    strategy:
      # Let every runner report. Otherwise the first failure cancels the
      # others and a macOS-version-specific problem hides the rest.
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Set GHA_BRANCH_NAME
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "GHA_BRANCH_NAME=${ALPHA_BRIDGE_SOURCE_REF##*/}" >> $GITHUB_ENV
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "GHA_BRANCH_NAME=${{ github.head_ref }}" >> $GITHUB_ENV
        fi
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "GHA_BRANCH_NAME=${ALPHA_BRIDGE_SOURCE_REF#refs/heads/}" >> $GITHUB_ENV
        fi

        echo "GHA_REPOSITORY=${{ github.event.pull_request.head.repo.full_name || github.repository }}" >> $GITHUB_ENV

      env:
        ALPHA_BRIDGE_SOURCE_SHA: ${{ (github.event_name == 'schedule' || 
          github.event_name == 'workflow_run') && 
          '060d86f1078a10eb0b547d717976c96edf10e3d7' || github.sha }}
        ALPHA_BRIDGE_SOURCE_REF: ${{ (github.event_name == 'schedule' || 
          github.event_name == 'workflow_run') && 'refs/heads/master' || 
          github.ref }}
        ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ (github.event_name == 'schedule' || 
          github.event_name == 'workflow_run') && 'master' || github.ref_name }}
    - name: Install BioDynaMo
      shell: zsh {0}
      run: |
        brew install curl
        # GHA macOS: unpin CMake to fix Homebrew conflict (actions/runner-images#12912)
        brew uninstall --force cmake || true
        brew untap local/pinned || true
        curl https://raw.githubusercontent.com/${GHA_REPOSITORY}/${GHA_BRANCH_NAME}/util/install | bash
        # remove whole bidynamo repository to catch errors related to paths pointing into the build dir
        mktemp -d
        find /tmp -iname biodynamo -type d || true
        rm -rf $(find $(mktemp -d)/../* -maxdepth 1 -iname biodynamo -type d 2>/dev/null)
        echo "Removed"
        find /tmp -iname biodynamo -type d || true

    - name: Checkout BioDynaMo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '060d86f1078a10eb0b547d717976c96edf10e3d7' || 
          github.sha }}
    - name: Set INSTALL_DIR
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "INSTALL_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "INSTALL_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV
        fi
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "INSTALL_DIR=$(echo ${HOME}/biodynamo-*)" >> $GITHUB_ENV
        fi

    # - name: Cache Third Party Packages
    #   uses: actions/cache@v4
    #   with:
    #     path: build/third_party
    #     key: ${{ runner.os }}-third-party-${{ hashFiles('cmake/external/SHA256Digests.cmake') }}

    - name: Build BioDynaMo
      shell: zsh {0}
      run: |
        cmake \
          -Dopencl=OFF \
          -Dparaview=ON \
          -Dbenchmark=ON \
          -Dlibgit2=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -B build
        cmake --build build --parallel --config Release

    # Don't do this in the `Build BioDynaMo step`, because notebooks might time out in GHA
    # runners, while waiting for other targets to be compiled. Run notebooks only on
    # macOS 10.15 until we managed to compile ROOT for 11.6 again.
    - name: Run notebooks
      shell: zsh {0}
      run: |
        cmake \
          -Dnotebooks=ON \
          -B build
        cmake --build build --parallel --config Release --target notebooks  -- -j1
      if: matrix.os == 'macos-10.15'

    - name: System tests BioDynaMo
      shell: zsh {0}
      working-directory: build
      run: |
        source $(find /Users -path "*/bin/*" -name "*thisbdm.sh")
        root --version
        root -config
        git config --global --add safe.directory '*'
        sudo git config --system user.name "Test User"
        sudo git config --system user.email user@test.com
        make run-demos
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: 060d86f1078a10eb0b547d717976c96edf10e3d7
        AB_WORKFLOW_DIGEST: 
          453622dfb6f3732ee3eb7b5813b3f71714314c454d7802d047b63eeb2660b0f1
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
        CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES =
        (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef input_identity(job):\n\
        \    for step in job.get(\"steps\", []):\n        if step.get(\"conclusion\"\
        ) != \"success\":\n            continue\n        name = step.get(\"name\"\
        , \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
        \                identity = name.removeprefix(prefix)\n                if
        re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
        \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n    if
        (\n        not parent\n        or parent.get(\"head_branch\") != \"alpha-bridge-ci\"\
        \n        or parent.get(\"status\") != \"completed\"\n    ):\n        return
        True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"[0-9a-f]{40}\"\
        , sha) is None:\n        raise ValueError(\"parent workflow has no exact configuration
        commit\")\n    record = get(f\"/repos/{repository}\")\n    marker_file = get(f\"\
        /repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\")\n \
        \   marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n    if
        (\n        record.get(\"fork\") is not True\n        or marker.get(\"schema\"\
        ) != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if job.get(\"name\") in INPUT_CHECK_NAMES\n\
        \        and job.get(\"conclusion\") == \"success\"\n        and input_identity(job)\n\
        \    ]\n    return not guards or any(\n        job not in guards and job.get(\"\
        conclusion\") != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get,
        *, repository, run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"branch\": current[\"head_branch\"],\n           \
        \ \"event\": event,\n            \"per_page\": 100,\n        }\n    )\n  \
        \  runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_branch\") != current[\"head_branch\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    (\n                        job[\"name\"] in INPUT_CHECK_NAMES\n\
        \                        if job_name in INPUT_CHECK_NAMES\n              \
        \          else job[\"name\"] == job_name\n                    )\n       \
        \             and job.get(\"status\") == \"completed\"\n                 \
        \   and job.get(\"conclusion\") == \"success\"\n                    and input_identity(job)
        == identity\n                ):\n                    return False\n      \
        \      if len(jobs) < 100:\n                break\n            page += 1\n\
        \    return True\n\n\ndef main():\n    inputs = {\n        \"source_commit\"\
        : os.environ[\"AB_HEAD_SHA\"],\n        \"workflow_definition\": os.environ[\"\
        AB_WORKFLOW_DIGEST\"],\n        \"event\": os.environ[\"AB_EVENT\"],\n   \
        \     \"schedule\": os.environ[\"AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"\
        AB_VARIABLES\"]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"\
        ]),\n        \"runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"\
        ImageVersion\", \"\")],\n        \"producer\": json.loads(os.environ.get(\"\
        AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs,
        sort_keys=True).encode()).hexdigest()\n\n    def get(path):\n        request
        = urllib.request.Request(\n            \"https://api.github.com\" + path,\n\
        \            headers={\n                \"Authorization\": \"Bearer \" + os.environ[\"\
        GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
        ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n           \
        \ },\n        )\n        with urllib.request.urlopen(request, timeout=60)
        as response:\n            return json.load(response)\n\n    should_run = inputs[\"\
        event\"] not in {\"schedule\", \"workflow_run\"} or (\n        (\n       \
        \     inputs[\"event\"] != \"workflow_run\"\n            or parent_has_work(get,
        os.environ[\"AB_REPOSITORY\"], inputs[\"producer\"])\n        )\n        and
        changed(\n            get,\n            repository=os.environ[\"AB_REPOSITORY\"\
        ],\n            run_id=int(os.environ[\"AB_RUN_ID\"]),\n            identity=identity,\n\
        \            job_name=\"CI input check\",\n        )\n    )\n    with open(os.environ[\"\
        GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n        output.write(f\"\
        digest={identity}\\nchanged={str(should_run).lower()}\\n\")\n    print(\"\
        CI inputs changed\" if should_run else \"CI inputs unchanged; build and test
        jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
    - name: CI input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
